name: ubt_korea_rebuild
description: "Rekonstruksi belajar tampilan UBT EPS TOPIK Korea (v1.0.15) dari temuan statik REA. Semua data dummy, tanpa backend, bukan app asli."
# Bukan app asli dan tidak untuk dipublikasikan.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

# Satu dependensi pihak ketiga: just_audio untuk pemutaran audio test
# (dipakai app asli juga). Tanpa itu, build CI tetap tanpa dependensi lain.
dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/audio/test_tone.mp3
