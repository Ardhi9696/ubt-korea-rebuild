# Aturan lint minimal tanpa package tambahan (tanpa flutter_lints),
# supaya `flutter analyze` jalan tanpa dependensi pub.dev.
analyzer:
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - avoid_print
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - use_key_in_widget_constructors
